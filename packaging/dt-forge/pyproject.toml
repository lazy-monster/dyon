[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dt-forge"
version = "0.7.1"
description = "Compatibility redirect: DT-Forge was renamed to Dyon. Installs 'dyon' and keeps 'import dt_forge' working."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "the Dyon authors", email = "galisamuel97@gmail.com" }]
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
]
# Pulls in the real framework. Floor set to the relicensed release so installing
# the redirect always brings in a PolyForm-licensed 'dyon'.
dependencies = ["dyon>=0.7.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dt_forge*"]
